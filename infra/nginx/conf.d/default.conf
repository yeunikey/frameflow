server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "nginx ready\n";
    }

    # Strip the public service prefix, keeping the remaining path and query string.
    # Resolve container names dynamically after service restarts.
    location ~ ^/v1/identity-service(?:/|$) {
        set $identity http://identity-service:3001;
        rewrite ^/v1/identity-service(?:/(.*))?$ /$1 break;
        proxy_pass $identity;
        proxy_intercept_errors on;
        error_page 502 504 =503 @api_unavailable;
    }

    location ~ ^/v1/document-service(?:/|$) {
        set $document http://document-service:3002;
        rewrite ^/v1/document-service(?:/(.*))?$ /$1 break;
        proxy_pass $document;
        proxy_intercept_errors on;
        error_page 502 504 =503 @api_unavailable;
    }

    location ~ ^/v1/workspace-service(?:/|$) {
        set $workspace http://workspace-service:3003;
        rewrite ^/v1/workspace-service(?:/(.*))?$ /$1 break;
        proxy_pass $workspace;
        proxy_intercept_errors on;
        error_page 502 504 =503 @api_unavailable;
    }

    location ~ ^/v1(?:/|$) {
        default_type application/json;
        return 404 '{"error":"api_route_not_found"}';
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"service_unavailable"}';
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
